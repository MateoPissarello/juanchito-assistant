services:
  - type: web
    name: juanchito-assistant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: ADMIN_USERNAME
        value: mateo
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
