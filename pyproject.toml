[project]
name = "juanchito-assitant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MateoPissarello", email = "mateopissa@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sqlmodel>=0.0.47",
    "typer>=0.12.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
juanchito = "juanchito_assitant.cli:main"
juanchito-assitant = "juanchito_assitant.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
